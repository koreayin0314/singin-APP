<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="robots" content="noindex, nofollow">
    <meta name="referrer" content="no-referrer">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>線上簽到</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f7f4ed; color: #2c3e50; }
        .banner-img { background-size: cover; background-position: center; background-color: #ece6d8; }
        .card-shadow { box-shadow: 0 10px 25px -5px rgba(44,62,80,.08), 0 8px 10px -6px rgba(44,62,80,.08); }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between py-6 px-4 sm:px-6">

    <div class="w-full max-w-md bg-white rounded-3xl card-shadow overflow-hidden border border-[#e8e1d5] p-6 sm:p-8 my-auto">

        <!-- 主視覺 Banner：依場次載入 -->
        <div id="banner" class="w-full h-32 sm:h-40 rounded-2xl banner-img mb-6 shadow-sm animate-pulse"></div>

        <div class="text-center mb-6">
            <h1 id="pageTitle" class="text-2xl font-bold tracking-wider text-[#1e3a5f]">線上簽到</h1>
            <p class="text-xs text-gray-500 mt-1">請選擇您的單位並勾選出席人員</p>
        </div>

        <form id="checkinForm" class="space-y-5">
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="unitSelect" class="block text-sm font-semibold text-[#1e3a5f]">選擇您的單位 (名單可能須等4-10秒)</label>
                    <span id="loadingNotice" class="text-xs text-red-500 font-medium" style="display:none;">資料同步中，請稍候</span>
                </div>
                <select id="unitSelect" required class="w-full bg-[#fcfbfa] border border-[#d8d0c1] rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#1e3a5f]/30 focus:border-[#1e3a5f] transition-all">
                    <option value="" disabled selected>請選擇單位...</option>
                </select>
            </div>

            <div>
                <label class="block text-sm font-semibold text-[#1e3a5f] mb-2">出席人員</label>
                <div id="membersContainer" class="bg-[#fcfbfa] border border-[#d8d0c1] rounded-xl p-4 min-h-[90px] flex flex-col justify-center items-center text-gray-400 text-sm">
                    請先選擇上方單位
                </div>
            </div>

            <button type="submit" id="submitBtn" class="w-full mt-2 bg-[#3d7a7d] hover:bg-[#2f6366] disabled:opacity-50 disabled:cursor-not-allowed text-white font-medium py-3.5 px-4 rounded-xl shadow-md transition-all duration-200 cursor-pointer text-center text-sm tracking-wide">
                完成簽到
            </button>
        </form>
    </div>

    <div id="successModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center card-shadow">
            <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">✓</div>
            <h3 class="text-lg font-bold text-[#1e3a5f] mb-1">簽到成功</h3>
            <p id="successMessage" class="text-sm text-gray-600 mb-6">您的簽到資料已成功送出！</p>
            <button onclick="closeModal()" class="w-full bg-[#3d7a7d] text-white py-2.5 rounded-xl text-sm font-medium hover:bg-[#2f6366] transition-all cursor-pointer">確定</button>
        </div>
    </div>

    <footer class="mt-6 text-center text-xs text-gray-400 tracking-wider">
        環管署策略規劃科 ‧ 線上簽到系統
    </footer>

    <script>
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw4aOyvVu_pPDHwhRdtc7fpwPcjA16TkOB3KIuwrRecOGibEmUJEwiPesBMm4NthUBDDQ/exec";
        const EVENT_ID = new URLSearchParams(location.search).get('event') || '';

        let allData = {};
        let checkedInNamesSet = new Set();

        function setBanner(url) {
            const el = document.getElementById('banner');
            if (!url) { el.classList.remove('animate-pulse'); return; }
            const img = new Image();
            img.onload = () => {
                el.style.backgroundImage = `url('${url}')`;
                el.classList.remove('animate-pulse');
            };
            img.onerror = () => el.classList.remove('animate-pulse');
            img.src = url;
        }

        window.addEventListener('DOMContentLoaded', () => {
            if (!EVENT_ID) {
                document.getElementById('pageTitle').textContent = '請掃描會場 QR Code 簽到';
                document.getElementById('submitBtn').disabled = true;
                document.getElementById('banner').classList.remove('animate-pulse');
                return;
            }
            fetch(WEB_APP_URL + "?action=getMembers&event=" + encodeURIComponent(EVENT_ID))
                .then(r => r.json())
                .then(result => {
                    if (result.error) {
                        document.getElementById('pageTitle').textContent = '找不到此場次';
                        document.getElementById('submitBtn').disabled = true;
                        document.getElementById('banner').classList.remove('animate-pulse');
                        return;
                    }
                    setBanner(result.banner);
                    if (result.eventTitle) {
                        document.getElementById('pageTitle').textContent = result.eventTitle;
                        document.title = result.eventTitle + ' 線上簽到';
                    }
                    if (result.open === false) {
                        document.getElementById('pageTitle').textContent += '（已截止）';
                        document.getElementById('submitBtn').disabled = true;
                    }
                    allData = result.data || {};
                    (result.checkedIn || []).forEach(n => checkedInNamesSet.add(n));
                    initUnits();
                })
                .catch(err => {
                    console.error('載入名單失敗:', err);
                    document.getElementById('banner').classList.remove('animate-pulse');
                });
        });

        function initUnits() {
            const sel = document.getElementById('unitSelect');
            sel.innerHTML = '<option value="" disabled selected>請選擇單位...</option>';
            Object.keys(allData).forEach(unit => {
                const o = document.createElement('option');
                o.value = unit; o.textContent = unit;
                sel.appendChild(o);
            });
        }

        const unitSelectElem = document.getElementById('unitSelect');
        const noticeElem = document.getElementById('loadingNotice');

        unitSelectElem.addEventListener('mousedown', () => { noticeElem.style.display = 'inline'; });

        unitSelectElem.addEventListener('change', function () {
            noticeElem.style.display = 'inline';
            const container = document.getElementById('membersContainer');
            container.innerHTML = '';
            container.classList.remove('justify-center', 'items-center', 'text-gray-400');
            container.classList.add('space-y-3', 'items-start');
            const members = allData[this.value] || [];

            setTimeout(() => {
                container.innerHTML = '';
                if (members.length === 0) {
                    container.innerHTML = '<span class="text-sm text-gray-400">此單位目前無設定人員</span>';
                } else {
                    members.forEach(member => {
                        const done = checkedInNamesSet.has(String(member.name).trim());
                        const label = document.createElement('label');
                        label.className = `flex items-center space-x-3 w-full p-1 rounded-lg transition-all ${done ? 'opacity-70 cursor-not-allowed' : 'cursor-pointer hover:bg-[#f4efe6]'}`;

                        const cb = document.createElement('input');
                        cb.type = 'checkbox';
                        cb.name = 'memberCheckbox';
                        cb.value = member.name;
                        cb.dataset.title = member.title;
                        cb.disabled = done;
                        cb.className = 'w-4 h-4 text-[#1e3a5f] rounded border-gray-300 focus:ring-[#1e3a5f]';

                        const span = document.createElement('span');
                        span.className = 'text-sm text-gray-800 font-medium';
                        span.textContent = member.name + ' ';
                        const t = document.createElement('span');
                        t.className = 'text-xs text-gray-500 ml-1';
                        t.textContent = `(${member.title})`;
                        span.appendChild(t);
                        if (done) {
                            const d = document.createElement('span');
                            d.className = 'text-xs text-red-500 ml-2 font-normal';
                            d.textContent = '已簽到完成';
                            span.appendChild(d);
                        }
                        label.append(cb, span);
                        container.appendChild(label);
                    });
                }
                noticeElem.style.display = 'none';
            }, 350);
        });

        document.getElementById('checkinForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const unit = unitSelectElem.value;
            if (!unit) { alert('請先選擇單位'); return; }

            const checkboxes = document.querySelectorAll('input[name="memberCheckbox"]:checked');
            if (checkboxes.length === 0) { alert('請至少勾選一位未簽到的人員'); return; }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '傳送中...';

            const now = new Date();
            const p = n => String(n).padStart(2, '0');
            const timeString = `${now.getFullYear()}/${p(now.getMonth() + 1)}/${p(now.getDate())} ${p(now.getHours())}:${p(now.getMinutes())}:${p(now.getSeconds())}`;

            const promises = Array.from(checkboxes).map(cb => fetch(WEB_APP_URL, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    event: EVENT_ID,
                    time: timeString,
                    unit: unit,
                    name: cb.value,
                    title: cb.dataset.title
                })
            }));

            Promise.all(promises).then(() => {
                const names = Array.from(checkboxes).map(cb => cb.value).join('、');
                document.getElementById('successMessage').textContent = `已成功為 ${unit} 的 ${names} 完成簽到！`;
                document.getElementById('successModal').classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = '完成簽到';
            }).catch(err => {
                console.error('簽到失敗:', err);
                alert('送出失敗，請稍後再試');
                submitBtn.disabled = false;
                submitBtn.textContent = '完成簽到';
            });
        });

        function closeModal() {
            document.getElementById('successModal').classList.add('hidden');
            location.reload();
        }
    </script>
</body>
</html>
