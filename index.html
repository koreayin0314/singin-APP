        body {

            background-position: center;
        }

            box-shadow: 0 10px 25px -5px rgba(44, 62, 80, 0.08), 0 8px 10px -6px rgba(44, 62, 80, 0.08);

        </div>

        <!-- 簽到表單 -->
        <form id="checkinForm" class="space-y-5">
            
            <!-- 選擇單位 -->
            <div>
                <div class="flex justify-between items-center mb-2">

                    <span id="loadingNotice" class="text-xs text-red-500 font-medium">資料同步中，請稍候</span>
                </div>

                    <option value="" disabled selected>請選擇單位...</option>
                </select>
            </div>
