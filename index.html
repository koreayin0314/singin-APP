<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>116年度會議線上簽到</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f7f4ed;
            color: #2c3e50;
        }
        .banner-img {
            background-image: url('https://lh3.googleusercontent.com/d/1x2oGLos5ei00Z8IQsV4GA8wOX8OFxMpb');
            background-size: cover;
            background-position: center;
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(44, 62, 80, 0.08), 0 8px 10px -6px rgba(44, 62, 80, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between py-6 px-4 sm:px-6">

    <div class="w-full max-w-md bg-white rounded-3xl card-shadow overflow-hidden border border-[#e8e1d5] p-6 sm:p-8 my-auto">
        
        <!-- 主視覺 Banner (純圖片) -->
        <div class="w-full h-32 sm:h-40 rounded-2xl banner-img mb-6 shadow-sm"></div>

        <!-- 標題 -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-wider text-[#1e3a5f]">線上簽到</h1>
            <p class="text-xs text-gray-500 mt-1">請選擇您的單位並勾選出席人員</p>
        </div>

        <!-- 簽到表單 -->
        <form id="checkinForm" class="space-y-5">
            
            <!-- 選擇單位 -->
            <div>
                <label for="unitSelect" class="block text-sm font-semibold text-[#1e3a5f] mb-2">選擇您的單位</label>
                <select id="unitSelect" required class="w-full bg-[#fcfbfa] border border-[#d8d0c1] rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#1e3a5f]/30 focus:border-[#1e3a5f] transition-all">
                    <option value="" disabled selected>請選擇單位...</option>
                </select>
            </div>

            <!-- 出席人員勾選區 -->
            <div>
                <label class="block text-sm font-semibold text-[#1e3a5f] mb-2">出席人員</label>
                <div id="membersContainer" class="bg-[#fcfbfa] border border-[#d8d0c1] rounded-xl p-4 min-h-[90px] flex flex-col justify-center items-center text-gray-400 text-sm">
                    請先上方選擇單位
                </div>
            </div>

            <!-- 提交按鈕 -->
            <button type="submit" id="submitBtn" class="w-full mt-2 bg-[#1e3a5f] hover:bg-[#152a45] text-white font-medium py-3.5 px-4 rounded-xl shadow-md transition-all duration-200 cursor-pointer text-center text-sm tracking-wide">
                完成簽到
            </button>
        </form>
    </div>

    <!-- 成功彈跳視窗 (Modal) -->
    <div id="successModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center card-shadow animate-fade-in">
            <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                ✓
            </div>
            <h3 class="text-lg font-bold text-[#1e3a5f] mb-1">簽到成功</h3>
            <p id="successMessage" class="text-sm text-gray-600 mb-6">您的簽到資料已成功送出！</p>
            <button onclick="closeModal()" class="w-full bg-[#1e3a5f] text-white py-2.5 rounded-xl text-sm font-medium hover:bg-[#152a45] transition-all cursor-pointer">
                確定
            </button>
        </div>
    </div>

    <!-- 頁尾 -->
    <footer class="mt-6 text-center text-xs text-gray-400 tracking-wider">
        環境部環境管理事務 ‧ 線上簽到系統
    </footer>

    <script>
        // ★ 請將此處替換為您最新部署的 Google Apps Script 網頁應用程式網址
        const WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw4aOyvVu_pPDHwhRdtc7fpwPcjA16TkOB3KIuwrRecOGibEmUJEwiPesBMm4NthUBDDQ/exec";

        let allData = {};

        // 頁面載入時從 Google Sheet 抓取單位與人員名單
        window.addEventListener('DOMContentLoaded', () => {
            fetch(WEB_APP_URL + "?action=getMembers")
                .then(response => response.json())
                .then(result => {
                    allData = result.data || {};
                    initUnits();
                })
                .catch(error => {
                    console.error('載入名單失敗:', error);
                    // 若連線失敗改用預設清單
                    allData = {
                        "環境部主秘室新聞公關組": [{ name: "曹志弘", title: "組長" }, { name: "梁淑婷", title: "科長" }],
                        "環管署廢管組": [{ name: "陳又楚", title: "技士" }],
                        "環管署環衛組": [{ name: "李瑞玲", title: "簡任技正" }, { name: "謝心色", title: "科長" }, { name: "陳聖閔", title: "技士" }],
                        "環管署執法組": [{ name: "范楓旻", title: "科長" }, { name: "劉易璁", title: "技士" }],
                        "環管署土基會": [{ name: "楊逸秋", title: "副分組長" }, { name: "張芯瑜", title: "環境技術師" }]
                    };
                    initUnits();
                });
        });

        function initUnits() {
            const unitSelect = document.getElementById('unitSelect');
            unitSelect.innerHTML = '<option value="" disabled selected>請選擇單位...</option>';
            
            Object.keys(allData).forEach(unit => {
                const option = document.createElement('option');
                option.value = unit;
                option.textContent = unit;
                unitSelect.appendChild(option);
            });
        }

        // 當單位改變時，動態渲染該單位的成員勾選清單 (支援多選 Checkbox)
        document.getElementById('unitSelect').addEventListener('change', function() {
            const selectedUnit = this.value;
            const container = document.getElementById('membersContainer');
            container.innerHTML = '';
            container.classList.remove('justify-center', 'items-center', 'text-gray-400');
            container.classList.add('space-y-3', 'items-start');

            const members = allData[selectedUnit] || [];

            if (members.length === 0) {
                container.innerHTML = '<span class="text-sm text-gray-400">此單位目前無設定人員</span>';
                return;
            }

            members.forEach((member, index) => {
                const label = document.createElement('label');
                label.className = 'flex items-center space-x-3 cursor-pointer w-full p-1 hover:bg-[#f4efe6] rounded-lg transition-all';
                label.innerHTML = `
                    <input type="checkbox" name="memberCheckbox" value="${member.name}" data-title="${member.title}" class="w-4 h-4 text-[#1e3a5f] rounded border-gray-300 focus:ring-[#1e3a5f]">
                    <span class="text-sm text-gray-800 font-medium">${member.name} <span class="text-xs text-gray-500 ml-1">(${member.title})</span></span>
                `;
                container.appendChild(label);
            });
        });

        // 提交表單
        document.getElementById('checkinForm').addEventListener('submit', function(e) {
            e.preventDefault();
            
            const unit = document.getElementById('unitSelect').value;
            if (!unit) {
                alert('請先選擇單位');
                return;
            }

            const checkboxes = document.querySelectorAll('input[name="memberCheckbox"]:checked');
            if (checkboxes.length === 0) {
                alert('請至少勾選一位出席人員');
                return;
            }

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.disabled = true;
            submitBtn.textContent = '傳送中...';

            const now = new Date();
            const timeString = now.getFullYear() + '/' + 
                             String(now.getMonth() + 1).padStart(2, '0') + '/' + 
                             String(now.getDate()).padStart(2, '0') + ' ' + 
                             String(now.getHours()).padStart(2, '0') + ':' + 
                             String(now.getMinutes()).padStart(2, '0') + ':' + 
                             String(now.getSeconds()).padStart(2, '0');

            // 逐一送出勾選的人員資料到 Google Sheet
            const promises = Array.from(checkboxes).map(cb => {
                const payload = {
                    time: timeString,
                    unit: unit,
                    name: cb.value,
                    title: cb.getAttribute('data-title')
                };
                return fetch(WEB_APP_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            });

            Promise.all(promises).then(() => {
                const namesList = Array.from(checkboxes).map(cb => cb.value).join('、');
                document.getElementById('successMessage').textContent = `已成功為 ${unit} 的 ${namesList} 完成簽到！`;
                document.getElementById('successModal').classList.remove('hidden');
                submitBtn.disabled = false;
                submitBtn.textContent = '完成簽到';
            }).catch(error => {
                console.error('簽到失敗:', error);
                alert('送出失敗，請稍後再試');
                submitBtn.disabled = false;
                submitBtn.textContent = '完成簽到';
            });
        });

        function closeModal() {
            document.getElementById('successModal').classList.add('hidden');
            location.reload();
        }
    </script>
</body>
</html>
