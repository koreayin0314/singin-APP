<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>116年度會議線上簽到</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap');
        body {
            font-family: 'Noto Sans TC', sans-serif;
            background-color: #f7f4ed;
            color: #2c3e50;
        }
        .banner-img {
            background-image: url('https://lh3.googleusercontent.com/d/1x2oGLos5ei00Z8IQsV4GA8wOX8OFxMpb');
            background-size: cover;
            background-position: center;
        }
        .card-shadow {
            box-shadow: 0 10px 25px -5px rgba(44, 62, 80, 0.08), 0 8px 10px -6px rgba(44, 62, 80, 0.08);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between py-6 px-4 sm:px-6">

    <div class="w-full max-w-md bg-white rounded-3xl card-shadow overflow-hidden border border-[#e8e1d5] p-6 sm:p-8 my-auto">
        
        <!-- 主視覺 Banner (純圖片) -->
        <div class="w-full h-32 sm:h-40 rounded-2xl banner-img mb-6 shadow-sm"></div>

        <!-- 標題 -->
        <div class="text-center mb-6">
            <h1 class="text-2xl font-bold tracking-wider text-[#1e3a5f]">線上簽到</h1>
            <p class="text-xs text-gray-500 mt-1">請選擇您的單位並勾選出席人員</p>
        </div>

        <!-- 簽到表單 -->
        <form id="checkinForm" class="space-y-5">
            
            <!-- 選擇單位 -->
            <div>
                <div class="flex justify-between items-center mb-2">
                    <label for="unitSelect" class="block text-sm font-semibold text-[#1e3a5f]">選擇您的單位</label>
                    <!-- 預設隱藏，選擇單位時才會短暫出現，載入完成後自動消失 -->
                    <span id="loadingNotice" class="text-xs text-red-500 font-medium" style="display: none;">資料同步中，請稍候</span>
                </div>
                <select id="unitSelect" required class="w-full bg-[#fcfbfa] border border-[#d8d0c1] rounded-xl px-4 py-3 text-sm text-gray-700 focus:outline-none focus:ring-2 focus:ring-[#1e3a5f]/30 focus:border-[#1e3a5f] transition-all">
                    <option value="" disabled selected>請選擇單位...</option>
                </select>
            </div>

            <!-- 出席人員勾選區 -->
            <div>
                <label class="block text-sm font-semibold text-[#1e3a5f] mb-2">出席人員</label>
                <div id="membersContainer" class="bg-[#fcfbfa] border border-[#d8d0c1] rounded-xl p-4 min-h-[90px] flex flex-col justify-center items-center text-gray-400 text-sm">
                    請先選擇上方單位
                </div>
            </div>

            <!-- 提交按鈕 -->
            <button type="submit" id="submitBtn" class="w-full mt-2 bg-[#1e3a5f] hover:bg-[#152a45] text-white font-medium py-3.5 px-4 rounded-xl shadow-md transition-all duration-200 cursor-pointer text-center text-sm tracking-wide">
                完成簽到
            </button>
        </form>
    </div>

    <!-- 成功彈跳視窗 -->
    <div id="successModal" class="fixed inset-0 bg-black/50 backdrop-blur-xs flex items-center justify-center p-4 hidden z-50">
        <div class="bg-white rounded-3xl max-w-sm w-full p-6 text-center card-shadow">
            <div class="w-14 h-14 bg-emerald-100 text-emerald-600 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl font-bold">
                ✓
            </div>
            <h3 class="text-lg font-bold text-[#1e3a5f] mb-1">簽到成功</h3>
            <p id="successMessage" class="text-sm text-gray-6
